name: SightLine
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SightLine:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../app
        type: folder
        excludes:
          - tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sightline.reader
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: SightLine
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: SightLine uses your camera to read a label on this device. Photos are not uploaded.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  SightLine:
    build:
      targets:
        SightLine: all
    run:
      config: Debug
